<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PremiumShop – a responsive, modern e-commerce UI template for online stores.">
    <meta name="keywords" content="ecommerce, online shop, premium template, bootstrap, responsive">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2c7be0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="PremiumShop">
    <meta property="og:description" content="PremiumShop – responsive e-commerce HTML template with modern UI components.">
    <meta property="og:image" content="assets/images/og-image.png">
    <meta property="og:url" content="/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@PremiumShop">
    <meta name="twitter:title" content="PremiumShop">
    <meta name="twitter:description" content="PremiumShop – responsive e-commerce HTML template with modern UI components.">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Analytics â€“ PremiumShop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div id="page-loader"><div class="loader-content"><div class="loader-spinner"></div><div class="loader-logo">PremiumShop</div></div></div>
    <div class="dashboard-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="index.html" class="logo">PremiumShop</a></div>
            <nav class="nav flex-column">
                <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a class="nav-link" href="dashboard_products.html"><i class="fas fa-box"></i> Products</a>
                <a class="nav-link" href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a class="nav-link" href="customers.html"><i class="fas fa-users"></i> Customers</a>
                <a class="nav-link active" href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a>
                <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="dashboard-header">
                <button class="btn btn-link d-lg-none" id="sidebarToggle"><i class="fas fa-bars"></i></button>
                <div class="header-search d-none d-md-flex"><input type="text" placeholder="Search..."><button><i class="fas fa-search"></i></button></div>
                <div class="header-user">
                    <div class="notification-badge"><i class="far fa-bell"></i><span class="badge bg-danger">3</span></div>
                    <div class="theme-switcher me-2"><button id="themeToggle" class="btn btn-sm btn-outline-secondary"><i class="fas fa-moon"></i></button></div>
                    <div class="user-dropdown"><img src="assets/images/avatar-placeholder.png" class="user-avatar"><span class="d-none d-md-inline">Admin</span></div>
                </div>
            </header>

            <div class="container-fluid px-0">
                <h1 class="h3 mb-4">Analytics</h1>

                <div class="row g-4 mb-4">
                    <div class="col-md-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-eye"></i></div>
                            <div class="stat-content">
                                <h3>45.2k</h3>
                                <p>Page Views</p>
                                <small class="text-success">+12.3%</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
                            <div class="stat-content">
                                <h3>328</h3>
                                <p>Orders</p>
                                <small class="text-success">+8.1%</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
                            <div class="stat-content">
                                <h3>$8,942</h3>
                                <p>Revenue</p>
                                <small class="text-success">+15.2%</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon"><i class="fas fa-users"></i></div>
                            <div class="stat-content">
                                <h3>2,451</h3>
                                <p>Visitors</p>
                                <small class="text-danger">-2.4%</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-8">
                        <div class="chart-container">
                            <h5>Sales Overview (Last 30 Days)</h5>
                            <canvas id="salesChart" style="height:300px;"></canvas>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="chart-container">
                            <h5>Traffic Sources</h5>
                            <canvas id="trafficChart" style="height:300px;"></canvas>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="chart-container">
                            <h5>Top Products</h5>
                            <canvas id="topProductsChart" style="height:200px;"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="chart-container">
                            <h5>Orders by Day</h5>
                            <canvas id="ordersByDayChart" style="height:200px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script>
        // Example charts for analytics page (you can expand these)
        document.addEventListener('DOMContentLoaded', function() {
            if (document.getElementById('salesChart')) {
                new Chart(document.getElementById('salesChart'), {
                    type: 'line',
                    data: {
                        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                        datasets: [{ label: 'Sales ($)', data: [1200, 1900, 1500, 2100], borderColor: '#4c6fff' }]
                    }
                });
            }
            if (document.getElementById('trafficChart')) {
                new Chart(document.getElementById('trafficChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Direct', 'Social', 'Email', 'Organic'],
                        datasets: [{ data: [45, 25, 15, 15], backgroundColor: ['#4c6fff', '#ff8f6b', '#6fcf97', '#f2c94c'] }]
                    }
                });
            }
        });
    </script>
</body>
</html>
